<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRIV XM Connector</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080c0a;
      --panel-bg: rgba(13, 20, 17, 0.7);
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.3);
      --emerald-dark: #064e3b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(16, 185, 129, 0.15);
      --font-outfit: 'Outfit', sans-serif;
      --font-space: 'Space Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      height: 420px;
      font-family: var(--font-outfit);
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 78, 59, 0.1) 0%, transparent 50%);
      color: var(--text-main);
      overflow: hidden;
      padding: 16px;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    /* Header styling */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--emerald), #059669);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--bg-dark);
      font-family: var(--font-space);
      box-shadow: 0 0 12px var(--emerald-glow);
    }

    .logo-text {
      font-family: var(--font-space);
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.5px;
      background: linear-gradient(to right, #ffffff, #a7f3d0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version {
      font-size: 10px;
      color: var(--text-muted);
      background: rgba(16, 185, 129, 0.1);
      padding: 2px 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    /* Main Card styling */
    .card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.3), transparent);
    }

    /* Status Section */
    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #6b7280;
      box-shadow: 0 0 6px #6b7280;
      transition: all 0.3s ease;
    }

    .status-indicator.active {
      background-color: var(--emerald);
      box-shadow: 0 0 10px var(--emerald);
      animation: pulse 2s infinite;
    }

    .status-indicator.error {
      background-color: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }

    .status-text {
      font-weight: 500;
      font-size: 14px;
    }

    /* Details Grid */
    .details-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 12px;
      font-size: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .details-label {
      color: var(--text-muted);
    }

    .details-val {
      font-weight: 500;
      text-align: right;
      color: var(--text-main);
      word-break: break-all;
    }

    /* Input group */
    .input-group {
      margin-bottom: 16px;
    }

    .input-label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    .server-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-main);
      font-size: 12px;
      font-family: var(--font-outfit);
      transition: all 0.2s ease;
    }

    .server-input:focus {
      outline: none;
      border-color: var(--emerald);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.15);
      background: rgba(0, 0, 0, 0.7);
    }

    /* Buttons */
    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--emerald), #059669);
      color: var(--bg-dark);
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-family: var(--font-space);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.25);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: rgba(16, 185, 129, 0.05);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.2);
      margin-top: 8px;
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(16, 185, 129, 0.1);
      border-color: var(--emerald);
      box-shadow: none;
    }

    .footer-note {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .heart-icon {
      color: var(--emerald);
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
      }
      70% {
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-container">
        <div class="logo-icon">P</div>
        <div class="logo-text">PRIV XM BRIDGE</div>
      </div>
      <div class="version">v1.0.0</div>
    </div>

    <!-- Status Card -->
    <div class="card">
      <div class="status-row">
        <div id="statusDot" class="status-indicator"></div>
        <span id="statusLabel" class="status-text">Checking status...</span>
      </div>

      <div class="details-grid">
        <div class="details-label">Sync Status</div>
        <div id="syncStatusText" class="details-val">Unknown</div>

        <div class="details-label">Account Connected</div>
        <div id="accountIdText" class="details-val">None</div>

        <div class="details-label">Last Sync</div>
        <div id="lastSyncText" class="details-val">Never</div>
      </div>
    </div>

    <!-- Configuration Card -->
    <div class="card" style="padding: 12px 16px;">
      <div class="input-group">
        <label class="input-label" for="serverUrl">PRIV Core Endpoint</label>
        <div class="input-wrapper">
          <input type="text" id="serverUrl" class="server-input" placeholder="http://localhost:3000">
        </div>
      </div>
      
      <button id="saveBtn" class="btn" style="padding: 8px; font-size: 12px; background: transparent; border: 1px solid var(--emerald); color: var(--emerald); box-shadow: none;">
        Save Server Endpoint
      </button>
    </div>

    <!-- Operations -->
    <button id="syncBtn" class="btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
      Synchronize Now
    </button>
    
    <button id="dashboardBtn" class="btn btn-secondary">
      Open PRIV Dashboard
    </button>

    <div class="footer-note">
      Engineered by <span class="heart-icon">✦</span> Sans Mercantile
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
