apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-core-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-core
  template:
    metadata:
      labels:
        app: ai-core
    spec:
      containers:
      - name: ai-core
        image: ai-core:latest
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
