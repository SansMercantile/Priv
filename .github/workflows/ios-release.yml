name: iOS release build

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version key (uploads land under releases/<version>/ when published)"
        required: false
        default: "1.0.0"
      export_method:
        description: "Xcode export method: app-store (TestFlight) | ad-hoc | release-testing"
        required: false
        default: "app-store"

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      EXPORT_METHOD: ${{ inputs.export_method }}
      BUNDLE_ID: com.sansmercantile.privcore
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing material is available
        run: |
          missing=0
          for name in IOS_TEAM_ID IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret $name (mirror from AWS Secrets Manager secret priv/platform-ios-signing)"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Import signing material into a temporary keychain
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security default-keychain -d user -s "$KEYCHAIN"

          P12="$RUNNER_TEMP/cert.p12"
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm -f "$P12"

          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PROFILE_PATH="$PROFILES_DIR/priv-core.mobileprovision"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          mv "$PROFILE_PATH" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project PrivCore.xcodeproj \
            -scheme PrivCore \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/PrivCore.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PrivCore.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: priv-core-ios
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true
